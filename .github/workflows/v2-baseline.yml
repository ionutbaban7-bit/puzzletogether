name: V2 baseline checks
on:
  push:
    branches:
      - "v2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-security-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Render regression contracts
        run: npm run test:render-contract
      - name: Catalog audit
        run: npm run catalog:audit
      - name: Start isolated room server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pt-test-data"
          DATA_DIR="$RUNNER_TEMP/pt-test-data" NODE_ENV=production HOST=127.0.0.1 PORT=3000 node src/server.js > "$RUNNER_TEMP/pt-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pt-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pt-server.log"
          exit 1
      - name: Reject unauthorized access and verify legitimate sessions
        run: node scripts/security-regression-test.mjs
      - name: Authenticated multiplayer puzzle layout
        run: npm run test:layout
      - name: Stop isolated room server
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/pt-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/pt-server.pid")" || true
          fi
          if test -f "$RUNNER_TEMP/pt-server.log"; then
            tail -n 50 "$RUNNER_TEMP/pt-server.log"
          fi
